# Multi-fault Litmus ChaosEngine: network latency, CPU hog and disk fill run one
# after another against the same service, with an SLO probe on each.
# Builds on the namespace, Deployment and Service from l4-litmus-chaos-experiment.yaml
# (apply that first). Each fault's definition comes from litmuschaos/chaos-charts:
#   for f in pod-network-latency pod-cpu-hog disk-fill; do
#     kubectl apply -n chaos-demo -f \
#       https://raw.githubusercontent.com/litmuschaos/chaos-charts/3.31.0/faults/kubernetes/$f/fault.yaml
#   done
# Apply: kubectl apply -f l-max-custom-chaos-experiment.yaml
#
# CI validates it against the real Litmus 3.31 CRDs (server-side dry run) and installs the
# fault definitions; it does not execute these three faults (network/CPU faults need a
# real node kernel and are not reliable on a shared runner).
#
# Scheduling: the legacy ChaosSchedule CRD is not part of the Litmus 3 operator install.
# To run this weekly use a ChaosCenter workflow / cron schedule, or a Kubernetes CronJob
# that re-applies the engine.

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: multi-fault-sa
  namespace: chaos-demo

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: multi-fault-role
  namespace: chaos-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "events", "configmaps", "replicationcontrollers"]
    verbs: ["create", "list", "get", "patch", "update", "delete", "deletecollection", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["list", "get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get", "delete", "deletecollection"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "list", "get", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: multi-fault-rb
  namespace: chaos-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: multi-fault-role
subjects:
  - kind: ServiceAccount
    name: multi-fault-sa
    namespace: chaos-demo

---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: multi-fault-chaos-engine
  namespace: chaos-demo
  labels:
    app: my-api-service
spec:
  appinfo:
    appns: chaos-demo
    applabel: "app=my-api-service"
    appkind: deployment
  engineState: active
  chaosServiceAccount: multi-fault-sa
  jobCleanUpPolicy: retain          # keep the helper pods for post-mortems
  annotationCheck: "false"
  experiments:
    # 1. Network: 2 s latency on 30% of the pods
    - name: pod-network-latency
      spec:
        components:
          experimentImage: litmuschaos/go-runner:3.31.0
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: NETWORK_LATENCY
              value: "2000"          # ms
            - name: JITTER
              value: "500"
            - name: PODS_AFFECTED_PERC
              value: "30"
            - name: CONTAINER_RUNTIME
              value: containerd
            - name: SOCKET_PATH
              value: /run/containerd/containerd.sock
        probe:
          - name: latency-slo-probe
            type: httpProbe
            mode: Continuous
            runProperties:
              probeTimeout: 10s
              interval: 5s
              retry: 2
              stopOnFailure: false
            httpProbe/inputs:
              url: http://my-api-service.chaos-demo.svc.cluster.local/
              insecureSkipVerify: false
              method:
                get:
                  criteria: "=="
                  responseCode: "200"

    # 2. CPU: 80% load on 2 cores of 30% of the pods
    - name: pod-cpu-hog
      spec:
        components:
          experimentImage: litmuschaos/go-runner:3.31.0
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "120"
            - name: CPU_CORES
              value: "2"
            - name: CPU_LOAD
              value: "80"
            - name: PODS_AFFECTED_PERC
              value: "30"
            - name: CONTAINER_RUNTIME
              value: containerd
            - name: SOCKET_PATH
              value: /run/containerd/containerd.sock
        probe:
          - name: availability-under-cpu-stress
            type: httpProbe
            mode: Continuous
            runProperties:
              probeTimeout: 10s
              interval: 5s
              retry: 2
              stopOnFailure: false
            httpProbe/inputs:
              url: http://my-api-service.chaos-demo.svc.cluster.local/
              insecureSkipVerify: false
              method:
                get:
                  criteria: "=="
                  responseCode: "200"

    # 3. Disk: fill 80% of the ephemeral storage limit of 30% of the pods
    - name: disk-fill
      spec:
        components:
          experimentImage: litmuschaos/go-runner:3.31.0
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: FILL_PERCENTAGE
              value: "80"
            - name: PODS_AFFECTED_PERC
              value: "30"
            - name: CONTAINER_RUNTIME
              value: containerd
            - name: SOCKET_PATH
              value: /run/containerd/containerd.sock
        probe:
          - name: deployment-present-probe
            type: k8sProbe
            mode: EOT
            runProperties:
              probeTimeout: 5s
              interval: 2s
              retry: 1
            k8sProbe/inputs:
              group: apps
              version: v1
              resource: deployments
              namespace: chaos-demo
              fieldSelector: "metadata.name=my-api-service"
              operation: present
