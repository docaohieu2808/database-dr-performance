# Litmus 3.x pod-delete chaos against a sample 3-replica service.
#
# Versions: litmus-core Helm chart 3.31.1 (operator/runner 3.31.0), experiment
# definitions from litmuschaos/chaos-charts tag 3.31.0.
#
# Install the operator + CRDs and the experiment definition once:
#   helm repo add litmuschaos https://litmuschaos.github.io/litmus-helm/
#   helm install litmus-core litmuschaos/litmus-core --version 3.31.1 -n litmus --create-namespace
#   kubectl create namespace chaos-demo
#   kubectl apply -n chaos-demo -f \
#     https://raw.githubusercontent.com/litmuschaos/chaos-charts/3.31.0/faults/kubernetes/pod-delete/fault.yaml
# Run the experiment:
#   kubectl apply -f l4-litmus-chaos-experiment.yaml
#   kubectl -n chaos-demo get chaosresult pod-delete-chaos-engine-pod-delete -o jsonpath='{.status.experimentStatus.verdict}'
# CI does exactly this on a kind cluster and requires verdict Pass.
#
# ChaosCenter (the Litmus 3 portal, helm chart `litmuschaos/litmus`)
# adds a UI, scheduling and workflows on top of this same CRD-based mechanism.

---
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-demo

---
# The application under test: any Deployment selected by label works
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-api-service
  namespace: chaos-demo
  labels:
    app: my-api-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: my-api-service
  template:
    metadata:
      labels:
        app: my-api-service
    spec:
      containers:
        - name: web
          image: nginx:1.31-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 2
          resources:
            requests:
              cpu: 10m
              memory: 16Mi

---
apiVersion: v1
kind: Service
metadata:
  name: my-api-service
  namespace: chaos-demo
spec:
  selector:
    app: my-api-service
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-delete-sa
  namespace: chaos-demo
  labels:
    app: pod-delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-delete-role
  namespace: chaos-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "deletecollection"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "get", "list", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["replicationcontrollers"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get", "delete", "deletecollection"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "list", "get", "patch", "update", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-delete-rb
  namespace: chaos-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-delete-role
subjects:
  - kind: ServiceAccount
    name: pod-delete-sa
    namespace: chaos-demo

---
# ChaosEngine: what to attack, which experiment, which probes decide pass/fail
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-delete-chaos-engine
  namespace: chaos-demo
  labels:
    app: pod-delete
spec:
  appinfo:
    appns: chaos-demo
    applabel: "app=my-api-service"
    appkind: deployment
  engineState: active
  chaosServiceAccount: pod-delete-sa
  jobCleanUpPolicy: delete
  annotationCheck: "false"
  experiments:
    - name: pod-delete
      spec:
        components:
          experimentImage: litmuschaos/go-runner:3.31.0
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "30"        # seconds of chaos
            - name: CHAOS_INTERVAL
              value: "10"        # seconds between deletions
            - name: PODS_AFFECTED_PERC
              value: "50"        # delete 50% of matching pods each round
            - name: FORCE
              value: "false"     # graceful termination
            - name: SEQUENCE
              value: "parallel"
        probe:
          # The service must keep answering while pods are being killed
          - name: api-health-probe
            type: httpProbe
            mode: Continuous
            runProperties:
              probeTimeout: 5s
              interval: 2s
              retry: 2
              stopOnFailure: false
            httpProbe/inputs:
              url: http://my-api-service.chaos-demo.svc.cluster.local/
              insecureSkipVerify: false
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
          # The Deployment object must still exist after the run
          - name: deployment-present-probe
            type: k8sProbe
            mode: EOT
            runProperties:
              probeTimeout: 5s
              interval: 2s
              retry: 1
            k8sProbe/inputs:
              group: apps
              version: v1
              resource: deployments
              namespace: chaos-demo
              fieldSelector: "metadata.name=my-api-service"
              operation: present
