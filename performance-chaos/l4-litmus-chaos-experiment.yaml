# Litmus Chaos pod-delete experiment
# Deletes random pods in a target namespace to test resilience and recovery
# Docs: https://litmuschaos.github.io/litmus/experiments/categories/pods/pod-delete/
#
# Prerequisites:
#   kubectl apply -f https://litmuschaos.github.io/litmus/litmus-operator-v3.0.0.yaml
#   kubectl apply -f https://hub.litmuschaos.io/api/chaos?file=charts/generic/pod-delete/experiment.yaml
#
# Apply: kubectl apply -f l4-litmus-chaos-experiment.yaml

---
# ServiceAccount for the experiment runner
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pod-delete-sa
  namespace: production
  labels:
    app: pod-delete
    chaos.litmuschaos.io/controller-manager: "true"

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-delete-role
  namespace: production
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "events", "replicationcontrollers"]
    verbs: ["create", "list", "get", "patch", "update", "delete", "deletecollection"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets", "daemonsets"]
    verbs: ["list", "get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "list", "get", "delete", "deletecollection"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["chaosengines", "chaosexperiments", "chaosresults"]
    verbs: ["create", "list", "get", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["list", "get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-delete-rb
  namespace: production
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-delete-role
subjects:
  - kind: ServiceAccount
    name: pod-delete-sa
    namespace: production

---
# ChaosEngine: defines what to target and which experiment to run
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: pod-delete-chaos-engine
  namespace: production
  labels:
    app: pod-delete
    experiment: pod-delete
spec:
  # Target application
  appinfo:
    appns: production
    applabel: "app=my-api-service"
    appkind: deployment

  # Run mode: parallel = all experiments at once; serial = one by one
  engineState: active
  chaosServiceAccount: pod-delete-sa

  # Monitoring — annotate pods for Prometheus scraping
  monitoring: true

  # Job cleanup policy: retain | delete
  jobCleanUpPolicy: delete

  # Annotations for the chaos runner pod
  annotationCheck: "false"

  experiments:
    - name: pod-delete
      spec:
        # Override default experiment parameters
        components:
          env:
            # Number of pods to delete per iteration
            - name: TOTAL_CHAOS_DURATION
              value: "60"        # seconds of chaos

            - name: CHAOS_INTERVAL
              value: "10"        # seconds between pod deletions

            # Percentage of pods to kill (mutually exclusive with PODS_AFFECTED_PERC)
            - name: PODS_AFFECTED_PERC
              value: "50"        # kill 50% of matching pods

            # Force delete (skip graceful termination)
            - name: FORCE
              value: "false"     # use graceful termination

            # Sequence: parallel | serial
            - name: SEQUENCE
              value: "parallel"

            # Node selector for chaos runner pod
            - name: NODE_LABEL
              value: ""

            # Target specific pod names (comma-separated; empty = random selection)
            - name: TARGET_PODS
              value: ""

            # Container runtime: docker | containerd | crio
            - name: CONTAINER_RUNTIME
              value: containerd

            # Socket path for container runtime
            - name: SOCKET_PATH
              value: /run/containerd/containerd.sock

        # Probes — health validation during and after chaos
        probe:
          # HTTP probe: verify API responds during chaos
          - name: api-health-probe
            type: httpProbe
            httpProbe/inputs:
              url: "http://my-api-service.production.svc.cluster.local/healthz"
              insecureSkipVerify: false
              responseTimeout: 5000
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            mode: Continuous
            runProperties:
              probeTimeout: 5
              interval: 5
              retry: 3
              probePollingInterval: 2
              stopOnFailure: false

          # Command probe: verify database connectivity during chaos
          - name: db-connectivity-probe
            type: cmdProbe
            cmdProbe/inputs:
              command: >
                kubectl exec -n production
                  $(kubectl get pod -n production -l app=my-api-service -o jsonpath='{.items[0].metadata.name}')
                  -- sh -c 'pg_isready -h postgres-primary -p 5432'
              comparator:
                type: string
                criteria: contains
                value: "accepting connections"
            mode: Edge
            runProperties:
              probeTimeout: 10
              interval: 10
              retry: 2
              stopOnFailure: false

          # k8s probe: verify deployment has minimum ready replicas
          - name: deployment-ready-probe
            type: k8sProbe
            k8sProbe/inputs:
              group: apps
              version: v1
              resource: deployments
              namespace: production
              fieldSelector: "metadata.name=my-api-service"
              labelSelector: "app=my-api-service"
              operation: present
            mode: Continuous
            runProperties:
              probeTimeout: 5
              interval: 10
              retry: 3
              stopOnFailure: false

---
# ChaosResult: read after experiment completes
# kubectl get chaosresult pod-delete-chaos-engine-pod-delete -n production -o yaml
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosResult
metadata:
  name: pod-delete-chaos-engine-pod-delete
  namespace: production
  labels:
    app: pod-delete
spec:
  engine: pod-delete-chaos-engine
  experiment: pod-delete
status:
  experimentStatus:
    phase: ""          # populated after run: Completed | Aborted
    verdict: ""        # Pass | Fail | Stopped
    failStep: ""
    probeSuccessPercentage: ""
