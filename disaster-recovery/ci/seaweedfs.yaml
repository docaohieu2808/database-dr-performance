# S3-compatible object store for the kind-based Velero test (stands in for AWS S3).
# No identities are configured, so any access key is accepted. Lab only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: velero
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          args: ["server", "-s3", "-dir=/data", "-volume.max=8", "-master.volumeSizeLimitMB=64"]
          ports:
            - containerPort: 8333
              name: s3
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: velero
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
