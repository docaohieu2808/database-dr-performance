name: redis-basic

# Single Redis with RDB + AOF persistence and a password.
# Switch to Valkey (BSD licensed fork) with: REDIS_IMAGE=valkey/valkey:9.1-alpine
# (Redis 8 is AGPLv3 / RSALv2 / SSPLv1 tri-licensed; Valkey is the Linux Foundation fork.)

services:
  redis:
    image: ${REDIS_IMAGE:-redis:8.10-alpine}
    container_name: redis-basic
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-redispassword}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redispassword}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    sysctls:
      net.core.somaxconn: 1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  redis-data:
