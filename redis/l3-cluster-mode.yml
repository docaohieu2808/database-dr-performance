name: redis-cluster

# Redis Cluster: 6 nodes (3 primaries + 3 replicas), 16384 hash slots split across
# the primaries. Losing one primary promotes its replica. Smoke + failover test:
# tests/redis-cluster-smoke.sh
# Switch to Valkey with: REDIS_IMAGE=valkey/valkey:9.1-alpine
#
# No cluster-announce-* options: inside one Docker network every node is reachable
# at its own container IP, which is what the cluster bus gossips. (announce-ip takes an
# IP, not a hostname; hostnames need cluster-announce-hostname, not needed here.)
# Clients outside Docker cannot reach those IPs: this lab is meant to be used from
# inside the network (docker compose exec / redis-cluster-init).

x-redis-cluster-node: &redis-cluster-node
  image: ${REDIS_IMAGE:-redis:8.10-alpine}
  restart: unless-stopped
  networks: [redis-cluster-net]
  environment:
    REDISCLI_AUTH: ${REDIS_PASSWORD:-clusterpassword}
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 3s
    timeout: 3s
    retries: 20
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

services:
  redis-node-1:
    <<: *redis-cluster-node
    container_name: redis-node-1
    ports:
      - "127.0.0.1:7001:6379"
    volumes: [redis-node-1-data:/data]
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --requirepass ${REDIS_PASSWORD:-clusterpassword}
      --masterauth ${REDIS_PASSWORD:-clusterpassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice

  redis-node-2:
    <<: *redis-cluster-node
    container_name: redis-node-2
    ports:
      - "127.0.0.1:7002:6379"
    volumes: [redis-node-2-data:/data]
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --requirepass ${REDIS_PASSWORD:-clusterpassword}
      --masterauth ${REDIS_PASSWORD:-clusterpassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice

  redis-node-3:
    <<: *redis-cluster-node
    container_name: redis-node-3
    ports:
      - "127.0.0.1:7003:6379"
    volumes: [redis-node-3-data:/data]
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --requirepass ${REDIS_PASSWORD:-clusterpassword}
      --masterauth ${REDIS_PASSWORD:-clusterpassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice

  redis-node-4:
    <<: *redis-cluster-node
    container_name: redis-node-4
    ports:
      - "127.0.0.1:7004:6379"
    volumes: [redis-node-4-data:/data]
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --requirepass ${REDIS_PASSWORD:-clusterpassword}
      --masterauth ${REDIS_PASSWORD:-clusterpassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice

  redis-node-5:
    <<: *redis-cluster-node
    container_name: redis-node-5
    ports:
      - "127.0.0.1:7005:6379"
    volumes: [redis-node-5-data:/data]
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --requirepass ${REDIS_PASSWORD:-clusterpassword}
      --masterauth ${REDIS_PASSWORD:-clusterpassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice

  redis-node-6:
    <<: *redis-cluster-node
    container_name: redis-node-6
    ports:
      - "127.0.0.1:7006:6379"
    volumes: [redis-node-6-data:/data]
    command: >
      redis-server --port 6379 --cluster-enabled yes
      --cluster-config-file nodes.conf --cluster-node-timeout 5000
      --requirepass ${REDIS_PASSWORD:-clusterpassword}
      --masterauth ${REDIS_PASSWORD:-clusterpassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice

  # One-shot: form the cluster once all six nodes are healthy
  redis-cluster-init:
    image: ${REDIS_IMAGE:-redis:8.10-alpine}
    container_name: redis-cluster-init
    restart: "no"
    networks: [redis-cluster-net]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-clusterpassword}
    depends_on:
      redis-node-1: {condition: service_healthy}
      redis-node-2: {condition: service_healthy}
      redis-node-3: {condition: service_healthy}
      redis-node-4: {condition: service_healthy}
      redis-node-5: {condition: service_healthy}
      redis-node-6: {condition: service_healthy}
    command:
      - sh
      - -c
      - |
        nodes=""
        for i in 1 2 3 4 5 6; do
          ip=$$(getent ahostsv4 "redis-node-$$i" | awk 'NR==1{print $$1}')
          nodes="$$nodes $$ip:6379"
        done
        # shellcheck disable=SC2086
        exec redis-cli --cluster create $$nodes --cluster-replicas 1 --cluster-yes

volumes:
  redis-node-1-data:
  redis-node-2-data:
  redis-node-3-data:
  redis-node-4-data:
  redis-node-5-data:
  redis-node-6-data:

networks:
  redis-cluster-net:
    driver: bridge
