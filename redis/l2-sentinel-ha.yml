name: redis-sentinel

# Redis Sentinel HA: 1 primary + 2 replicas + 3 sentinels (quorum 2).
# Sentinels watch the primary and promote a replica when it is gone for 5 s.
# Clients ask a sentinel (port 26379) which node is the primary.
# Switch to Valkey with: REDIS_IMAGE=valkey/valkey:9.1-alpine
# Failover test: tests/redis-sentinel-failover.sh

x-redis-node: &redis-node
  image: ${REDIS_IMAGE:-redis:8.10-alpine}
  restart: unless-stopped
  networks: [redis-sentinel-net]
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}
    REDISCLI_AUTH: ${REDIS_PASSWORD:-redispassword}
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 3s
    timeout: 3s
    retries: 20

x-sentinel: &sentinel
  image: ${REDIS_IMAGE:-redis:8.10-alpine}
  restart: unless-stopped
  networks: [redis-sentinel-net]
  environment:
    REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}   # sentinel itself has no password
  # Sentinel rewrites its own config file, so generate a writable copy on start.
  # Sentinel monitors the primary by IP (resolved once at start): a hostname that stops
  # resolving after the container dies stalls Sentinel's event loop and trips TILT mode.
  command:
    - sh
    - -c
    - |
      primary_ip=$$(getent hosts redis-primary | awk '{print $$1}')
      cat > /tmp/sentinel.conf <<EOF
      port 26379
      dir /tmp
      sentinel monitor mymaster $$primary_ip 6379 2
      sentinel auth-pass mymaster $$REDIS_PASSWORD
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 10000
      sentinel parallel-syncs mymaster 1
      EOF
      exec redis-sentinel /tmp/sentinel.conf
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "26379", "ping"]
    interval: 3s
    timeout: 3s
    retries: 20
  depends_on:
    redis-primary: {condition: service_healthy}
    redis-replica-1: {condition: service_healthy}
    redis-replica-2: {condition: service_healthy}

services:
  redis-primary:
    <<: *redis-node
    container_name: redis-primary
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
      --masterauth ${REDIS_PASSWORD:-redispassword}
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-primary-data:/data]

  redis-replica-1:
    <<: *redis-node
    container_name: redis-replica-1
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
      --masterauth ${REDIS_PASSWORD:-redispassword}
      --replicaof redis-primary 6379 --replica-read-only yes
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice
    ports: ["127.0.0.1:6380:6379"]
    volumes: [redis-replica-1-data:/data]
    depends_on:
      redis-primary: {condition: service_healthy}

  redis-replica-2:
    <<: *redis-node
    container_name: redis-replica-2
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:-redispassword}
      --masterauth ${REDIS_PASSWORD:-redispassword}
      --replicaof redis-primary 6379 --replica-read-only yes
      --appendonly yes --appendfsync everysec --maxmemory 256mb --loglevel notice
    ports: ["127.0.0.1:6381:6379"]
    volumes: [redis-replica-2-data:/data]
    depends_on:
      redis-primary: {condition: service_healthy}

  redis-sentinel-1:
    <<: *sentinel
    container_name: redis-sentinel-1
    ports: ["127.0.0.1:26379:26379"]

  redis-sentinel-2:
    <<: *sentinel
    container_name: redis-sentinel-2
    ports: ["127.0.0.1:26380:26379"]

  redis-sentinel-3:
    <<: *sentinel
    container_name: redis-sentinel-3
    ports: ["127.0.0.1:26381:26379"]

volumes:
  redis-primary-data:
  redis-replica-1-data:
  redis-replica-2-data:

networks:
  redis-sentinel-net:
    driver: bridge

# Client example (redis-py):
#   from redis.sentinel import Sentinel
#   s = Sentinel([("localhost", 26379), ("localhost", 26380), ("localhost", 26381)])
#   s.master_for("mymaster", password="redispassword").set("k", "v")
