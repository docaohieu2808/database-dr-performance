version: "3.9"

# Redis Sentinel HA: 1 primary + 2 replicas + 3 sentinels
# Sentinel monitors primary, triggers automatic failover on failure
# Clients connect to sentinel to discover current primary address

services:
  redis-primary:
    image: redis:7.2-alpine
    container_name: redis-primary
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redispassword}
        --masterauth ${REDIS_PASSWORD:-redispassword}
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --save 900 1
        --save 300 10
        --loglevel notice
    ports:
      - "6379:6379"
    volumes:
      - redis-primary-data:/data
    networks:
      redis-sentinel-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    image: redis:7.2-alpine
    container_name: redis-replica-1
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redispassword}
        --masterauth ${REDIS_PASSWORD:-redispassword}
        --replicaof redis-primary 6379
        --replica-read-only yes
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --loglevel notice
    ports:
      - "6380:6379"
    volumes:
      - redis-replica-1-data:/data
    networks:
      redis-sentinel-net:
        ipv4_address: 172.20.0.11
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    image: redis:7.2-alpine
    container_name: redis-replica-2
    restart: unless-stopped
    command: >
      redis-server
        --requirepass ${REDIS_PASSWORD:-redispassword}
        --masterauth ${REDIS_PASSWORD:-redispassword}
        --replicaof redis-primary 6379
        --replica-read-only yes
        --appendonly yes
        --appendfsync everysec
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --loglevel notice
    ports:
      - "6381:6379"
    volumes:
      - redis-replica-2-data:/data
    networks:
      redis-sentinel-net:
        ipv4_address: 172.20.0.12
    depends_on:
      redis-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Sentinel 1
  redis-sentinel-1:
    image: redis:7.2-alpine
    container_name: redis-sentinel-1
    restart: unless-stopped
    command: >
      sh -c "
        echo 'bind 0.0.0.0' > /etc/sentinel.conf &&
        echo 'sentinel announce-ip redis-sentinel-1' >> /etc/sentinel.conf &&
        echo 'sentinel announce-port 26379' >> /etc/sentinel.conf &&
        echo 'sentinel monitor mymaster redis-primary 6379 2' >> /etc/sentinel.conf &&
        echo 'sentinel auth-pass mymaster ${REDIS_PASSWORD:-redispassword}' >> /etc/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 10000' >> /etc/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /etc/sentinel.conf &&
        echo 'loglevel notice' >> /etc/sentinel.conf &&
        redis-sentinel /etc/sentinel.conf
      "
    ports:
      - "26379:26379"
    networks:
      redis-sentinel-net:
        ipv4_address: 172.20.0.20
    depends_on:
      redis-primary:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  # Sentinel 2
  redis-sentinel-2:
    image: redis:7.2-alpine
    container_name: redis-sentinel-2
    restart: unless-stopped
    command: >
      sh -c "
        echo 'bind 0.0.0.0' > /etc/sentinel.conf &&
        echo 'sentinel announce-ip redis-sentinel-2' >> /etc/sentinel.conf &&
        echo 'sentinel announce-port 26379' >> /etc/sentinel.conf &&
        echo 'sentinel monitor mymaster redis-primary 6379 2' >> /etc/sentinel.conf &&
        echo 'sentinel auth-pass mymaster ${REDIS_PASSWORD:-redispassword}' >> /etc/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 10000' >> /etc/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /etc/sentinel.conf &&
        echo 'loglevel notice' >> /etc/sentinel.conf &&
        redis-sentinel /etc/sentinel.conf
      "
    ports:
      - "26380:26379"
    networks:
      redis-sentinel-net:
        ipv4_address: 172.20.0.21
    depends_on:
      redis-primary:
        condition: service_healthy

  # Sentinel 3
  redis-sentinel-3:
    image: redis:7.2-alpine
    container_name: redis-sentinel-3
    restart: unless-stopped
    command: >
      sh -c "
        echo 'bind 0.0.0.0' > /etc/sentinel.conf &&
        echo 'sentinel announce-ip redis-sentinel-3' >> /etc/sentinel.conf &&
        echo 'sentinel announce-port 26379' >> /etc/sentinel.conf &&
        echo 'sentinel monitor mymaster redis-primary 6379 2' >> /etc/sentinel.conf &&
        echo 'sentinel auth-pass mymaster ${REDIS_PASSWORD:-redispassword}' >> /etc/sentinel.conf &&
        echo 'sentinel down-after-milliseconds mymaster 5000' >> /etc/sentinel.conf &&
        echo 'sentinel failover-timeout mymaster 10000' >> /etc/sentinel.conf &&
        echo 'sentinel parallel-syncs mymaster 1' >> /etc/sentinel.conf &&
        echo 'loglevel notice' >> /etc/sentinel.conf &&
        redis-sentinel /etc/sentinel.conf
      "
    ports:
      - "26381:26379"
    networks:
      redis-sentinel-net:
        ipv4_address: 172.20.0.22
    depends_on:
      redis-primary:
        condition: service_healthy

volumes:
  redis-primary-data:
  redis-replica-1-data:
  redis-replica-2-data:

networks:
  redis-sentinel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

# --- Client connection example (Python redis-py) ---
# from redis.sentinel import Sentinel
# sentinel = Sentinel([
#     ('localhost', 26379),
#     ('localhost', 26380),
#     ('localhost', 26381),
# ], socket_timeout=0.5, password='redispassword')
# master = sentinel.master_for('mymaster', socket_timeout=0.5)
# slave  = sentinel.slave_for('mymaster', socket_timeout=0.5)
#
# --- Verify sentinel ---
# redis-cli -p 26379 sentinel masters
# redis-cli -p 26379 sentinel slaves mymaster
# redis-cli -p 26379 sentinel failover mymaster
