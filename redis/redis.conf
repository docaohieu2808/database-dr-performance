# Redis / Valkey config for l1. The password is passed on the command line
# (--requirepass) from the compose file so it never lives in this file.
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: RDB snapshots
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Persistence: AOF
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-rewrite-incremental-fsync yes

# Memory (cache semantics: evict least recently used keys when full)
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Limits
maxclients 1000
tcp-keepalive 300
timeout 0

loglevel notice
logfile ""
