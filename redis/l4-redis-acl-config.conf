# Redis ACL (Access Control List) Configuration
# Redis 6+ ACL system: per-user permissions on commands, keys, channels
# Reference: https://redis.io/docs/management/security/acl/
#
# Format: user <name> [on|off] [>password] [~key-pattern] [&channel-pattern] [+|-command]
# Load via: ACL LOADFILE or aclfile directive in redis.conf
# Reload live: redis-cli ACL LOAD

###############################################################################
# Default user — disable or restrict immediately
###############################################################################
# Disable the default unauthenticated user entirely
user default off nopass nocommands nokeys

###############################################################################
# Administrative superuser (DBA / ops team)
###############################################################################
user admin on >AdminStr0ngP@ss ~* &* +@all

###############################################################################
# Application read-write user
# Can read/write all keys, no admin commands, no dangerous ops
###############################################################################
user appuser on >AppStr0ngP@ss \
  ~app:* \
  &* \
  +@read \
  +@write \
  +@string \
  +@hash \
  +@list \
  +@set \
  +@sortedset \
  +@stream \
  +@pubsub \
  +@scripting \
  +@transactions \
  -@admin \
  -@dangerous \
  -keys \
  -flushdb \
  -flushall \
  -debug \
  -config \
  -acl \
  -shutdown \
  -slaveof \
  -replicaof \
  -migrate \
  -restore \
  -sort \
  -object

###############################################################################
# Read-only replica / analytics user
# Can only read keys, no writes, no admin
###############################################################################
user readonly on >ReadOnlyP@ss \
  ~* \
  &* \
  +@read \
  +@string \
  +@hash \
  +@list \
  +@set \
  +@sortedset \
  +ping \
  +info \
  +select \
  -@write \
  -@admin \
  -@dangerous

###############################################################################
# Cache-only user (specific key namespace)
# Restricted to cache: prefix, basic get/set/del/ttl
###############################################################################
user cacheuser on >CacheP@ss \
  ~cache:* \
  &* \
  +get \
  +set \
  +del \
  +exists \
  +expire \
  +ttl \
  +pttl \
  +pexpire \
  +expireat \
  +pexpireat \
  +persist \
  +type \
  +scan \
  +mget \
  +mset \
  +msetnx \
  +getset \
  +getdel \
  +getex \
  +ping \
  -@all

###############################################################################
# Session store user (session: prefix only)
###############################################################################
user sessionuser on >SessionP@ss \
  ~session:* \
  &* \
  +get \
  +set \
  +setex \
  +psetex \
  +del \
  +exists \
  +expire \
  +ttl \
  +ping \
  -@all

###############################################################################
# Pub/Sub only user (can only publish/subscribe, no key access)
###############################################################################
user pubsubuser on >PubSubP@ss \
  ~* \
  &notifications:* \
  &alerts:* \
  +subscribe \
  +unsubscribe \
  +psubscribe \
  +punsubscribe \
  +publish \
  +pubsub \
  +ping \
  -@all

###############################################################################
# Monitoring / metrics user (INFO, LATENCY, MEMORY, SLOWLOG — no data access)
###############################################################################
user monitoring on >MonitorP@ss \
  ~* \
  &* \
  +info \
  +ping \
  +latency \
  +memory \
  +slowlog \
  +command \
  +client|list \
  +client|info \
  +cluster|info \
  +cluster|nodes \
  +dbsize \
  +time \
  -@all

###############################################################################
# Replication user (used by replicas to authenticate to primary)
###############################################################################
user replicator on >ReplicaP@ss \
  ~* \
  &* \
  +psync \
  +replconf \
  +ping \
  -@all

###############################################################################
# Backup user (BGSAVE, BGREWRITEAOF, CONFIG GET — read-only backup ops)
###############################################################################
user backupuser on >BackupP@ss \
  ~* \
  &* \
  +bgsave \
  +bgrewriteaof \
  +lastsave \
  +debug|sleep \
  +config|get \
  +ping \
  +info \
  -@all

# --- Apply in redis.conf ---
# aclfile /etc/redis/redis-acl.conf
# acllog-max-len 128
#
# --- Verify ---
# redis-cli -a AdminStr0ngP@ss ACL LIST
# redis-cli -a AdminStr0ngP@ss ACL WHOAMI
# redis-cli -a AdminStr0ngP@ss ACL CAT
# redis-cli -u redis://appuser:AppStr0ngP@ss@localhost:6379 SET app:key value
# redis-cli -u redis://readonly:ReadOnlyP@ss@localhost:6379 SET forbidden val
# (error) NOPERM this user has no permissions to run the 'set' command
