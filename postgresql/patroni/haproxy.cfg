global
  maxconn 100

defaults
  log global
  mode tcp
  retries 2
  timeout client 30m
  timeout connect 4s
  timeout server 30m
  timeout check 5s

listen stats
  mode http
  bind *:7000
  stats enable
  stats uri /
  stats refresh 5s

# Port 5000: routes to current primary only (read-write)
listen postgres-primary
  bind *:5000
  option httpchk GET /primary
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server patroni1 patroni1:5432 maxconn 100 check port 8008
  server patroni2 patroni2:5432 maxconn 100 check port 8008
  server patroni3 patroni3:5432 maxconn 100 check port 8008

# Port 5001: routes to replica nodes (read-only load balancing)
listen postgres-replicas
  bind *:5001
  option httpchk GET /replica
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server patroni1 patroni1:5432 maxconn 100 check port 8008
  server patroni2 patroni2:5432 maxconn 100 check port 8008
  server patroni3 patroni3:5432 maxconn 100 check port 8008
