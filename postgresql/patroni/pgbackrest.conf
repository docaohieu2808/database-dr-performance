# pgBackRest config shared by all Patroni nodes. The repository is a volume
# mounted on every node, so whichever node is primary pushes WAL to one place.
[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=2
start-fast=y
log-level-console=info

[main]
pg1-path=/data/pgdata
pg1-socket-path=/var/run/postgresql
