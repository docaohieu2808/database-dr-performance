# Patroni 4.x base config (learning material). Per-node values (name, addresses,
# passwords, data dir, DCS host) come from PATRONI_* environment variables in
# l3-patroni-ha-cluster.yml, which override this file.
#
# Status:   docker exec patroni1 patronictl -c /etc/patroni/patroni.yml list
# Switchover: patronictl -c /etc/patroni/patroni.yml switchover postgres-ha

scope: postgres-ha
namespace: /db/

restapi:
  listen: 0.0.0.0:8008
  # REST credentials (needed for switchover/restart/reload; health GETs used by
  # HAProxy stay open) come from PATRONI_RESTAPI_USERNAME / PATRONI_RESTAPI_PASSWORD.

etcd3:
  host: etcd:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576   # 1 MB: a replica lagging more is not promoted
    synchronous_mode: false            # true = zero RPO, needs a sync replica
    postgresql:
      use_pg_rewind: true              # resync the old primary after failover
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 10
        max_replication_slots: 10
        wal_log_hints: "on"            # required by pg_rewind
        archive_mode: "on"
        archive_command: "pgbackrest --stanza=main archive-push %p"
        archive_timeout: 60

  initdb:
    - encoding: UTF8
    - data-checksums                   # required by pg_rewind together with wal_log_hints

  pg_hba:
    - local all postgres peer          # pgBackRest connects over the unix socket
    - host replication replicator 0.0.0.0/0 scram-sha-256
    - host all all 0.0.0.0/0 scram-sha-256

  post_bootstrap: /usr/local/bin/pgbackrest-stanza-create.sh

postgresql:
  listen: 0.0.0.0:5432
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
    superuser:
      username: postgres
  parameters:
    shared_buffers: 128MB
    log_connections: "on"
    log_disconnections: "on"

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
