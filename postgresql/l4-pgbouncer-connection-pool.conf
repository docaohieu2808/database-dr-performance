[databases]
# Format: db_alias = host=<host> port=<port> dbname=<dbname> user=<user>
appdb = host=postgres-primary port=5432 dbname=appdb user=pguser
appdb_replica = host=postgres-replica port=5432 dbname=appdb user=pguser pool_size=20

[pgbouncer]
###############################################################################
# General settings
###############################################################################
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =

# Authentication: scram-sha-256 is the PostgreSQL 14+ default (md5 is deprecated).
# A userlist entry may hold the plaintext password or the server's SCRAM verifier.
# Production: prefer auth_user + auth_query so PgBouncer reads verifiers itself.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
# auth_user = pgbouncer
# auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

# Admin access
admin_users = pguser
stats_users = pguser

###############################################################################
# Connection pooling mode
# session   - server conn held for full client session (safest, least efficient)
# transaction - server conn held per transaction (recommended for most apps)
# statement - server conn held per statement (stateless queries only)
###############################################################################
pool_mode = transaction

###############################################################################
# Pool sizing
###############################################################################
# Max total server-side connections across all pools
max_client_conn = 1000

# Default pool size per database/user pair
default_pool_size = 25

# Minimum maintained connections per pool
min_pool_size = 5

# How many extra connections to allow beyond pool_size when pool is full
reserve_pool_size = 10

# Seconds before extra connections from reserve_pool are released
reserve_pool_timeout = 5.0

# Max DB connections per user (0 = unlimited)
max_db_connections = 100

# Max connections per user across all DBs (0 = unlimited)
max_user_connections = 50

###############################################################################
# Timeouts (seconds)
###############################################################################
# How long a client can sit idle before being disconnected
client_idle_timeout = 600

# How long a server connection can sit idle before being dropped
server_idle_timeout = 600

# Max time to wait for a server connection
server_connect_timeout = 15

# Max time to wait for a query result from server
query_timeout = 0

# Max time a client can wait in queue for a connection
client_login_timeout = 60

# Kill server connection if it hasn't been used for this many seconds
server_lifetime = 3600

# server_reset_query only runs in session pooling. In transaction pooling it is
# skipped unless server_reset_query_always = 1 (not needed: state does not leak
# between transactions if clients do not use SET / session-level features).
server_reset_query = DISCARD ALL
server_reset_query_always = 0

###############################################################################
# TLS / SSL
###############################################################################
# client_tls_sslmode = prefer
# client_tls_key_file = /etc/pgbouncer/certs/pgbouncer.key
# client_tls_cert_file = /etc/pgbouncer/certs/pgbouncer.crt
# client_tls_ca_file = /etc/pgbouncer/certs/ca.crt

# server_tls_sslmode = prefer
# server_tls_ca_file = /etc/pgbouncer/certs/ca.crt

###############################################################################
# Logging
###############################################################################
# No logfile/pidfile: log to stdout so `docker compose logs` works

# Log levels: 0=quiet, 1=normal, 2=verbose, 3=debug
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Syslog
syslog = 0
syslog_facility = daemon
syslog_ident = pgbouncer

###############################################################################
# Dangerous options (only change if you know what you're doing)
###############################################################################
# Ignore startup parameters sent by client
ignore_startup_parameters = extra_float_digits,search_path

# Protocol-level prepared statements in transaction pooling (PgBouncer >= 1.21):
# > 0 = PgBouncer tracks them and re-prepares on whichever server connection is used.
# 0 breaks drivers that use prepared statements (JDBC, asyncpg, pgx...).
max_prepared_statements = 100

# DNS resolution cache lifetime
dns_max_ttl = 15
dns_nxdomain_ttl = 15

###############################################################################
# Userlist file format (/etc/pgbouncer/userlist.txt):
#   "username" "plaintext-password"        (what the l4 compose generates, lab only)
#   "username" "SCRAM-SHA-256$4096:..."    (copy from pg_authid.rolpassword)
###############################################################################
