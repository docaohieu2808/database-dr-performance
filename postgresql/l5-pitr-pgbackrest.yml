name: pg-pitr

# Single PostgreSQL 18 with continuous WAL archiving (pgBackRest) so that
# point-in-time recovery works. Walk-through and assertions: tests/pitr-pgbackrest.sh
#
# Restore runs in a one-off container against the same two volumes while the
# database container is stopped (see the script).

services:
  postgres:
    image: pg-pitr:local
    build:
      context: ./pitr
    container_name: pg-pitr
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pgpassword}
      POSTGRES_DB: appdb
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=main archive-push %p
      - -c
      - archive_timeout=60
    volumes:
      - pgdata:/var/lib/postgresql
      - pgbackrest-repo:/var/lib/pgbackrest
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
  pgbackrest-repo:
