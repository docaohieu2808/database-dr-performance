name: patroni-ha

# Patroni 4 HA cluster: 3 PostgreSQL 18 nodes, a single-node etcd as the DCS and
# HAProxy in front. WAL is archived with pgBackRest into a volume shared by all nodes.
# Passwords are lab defaults; override them via .env before using anything real.

x-patroni: &patroni
  image: patroni-pg18:local
  build:
    context: ./patroni
  restart: unless-stopped
  networks: [patroni-net]
  depends_on:
    etcd:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-patroni-env: &patroni-env
  PATRONI_ETCD3_HOST: etcd:2379
  PATRONI_SCOPE: postgres-ha
  PATRONI_RESTAPI_LISTEN: 0.0.0.0:8008
  PATRONI_RESTAPI_USERNAME: patroni
  PATRONI_RESTAPI_PASSWORD: ${PATRONI_REST_PASSWORD:-rest-lab-password}
  PATRONI_POSTGRESQL_LISTEN: 0.0.0.0:5432
  PATRONI_POSTGRESQL_DATA_DIR: /data/pgdata
  PATRONI_SUPERUSER_USERNAME: postgres
  PATRONI_SUPERUSER_PASSWORD: ${PG_SUPERUSER_PASSWORD:-superpassword}
  PATRONI_REPLICATION_USERNAME: replicator
  PATRONI_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:-replpassword}

services:
  # Distributed configuration store (leader lock + cluster state)
  etcd:
    image: quay.io/coreos/etcd:v3.7.3
    container_name: etcd
    restart: unless-stopped
    command:
      - etcd
      - --name=etcd0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
    volumes:
      - etcd-data:/etcd-data
    networks: [patroni-net]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  patroni1:
    <<: *patroni
    container_name: patroni1
    hostname: patroni1
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni1
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni1:5432
    volumes:
      - patroni1-data:/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./patroni/patroni.yml:/etc/patroni/patroni.yml:ro
    ports:
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:8008:8008"

  patroni2:
    <<: *patroni
    container_name: patroni2
    hostname: patroni2
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni2
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni2:5432
    volumes:
      - patroni2-data:/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./patroni/patroni.yml:/etc/patroni/patroni.yml:ro
    ports:
      - "127.0.0.1:5433:5432"
      - "127.0.0.1:8009:8008"

  patroni3:
    <<: *patroni
    container_name: patroni3
    hostname: patroni3
    environment:
      <<: *patroni-env
      PATRONI_NAME: patroni3
      PATRONI_RESTAPI_CONNECT_ADDRESS: patroni3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: patroni3:5432
    volumes:
      - patroni3-data:/data
      - pgbackrest-repo:/var/lib/pgbackrest
      - ./patroni/patroni.yml:/etc/patroni/patroni.yml:ro
    ports:
      - "127.0.0.1:5434:5432"
      - "127.0.0.1:8010:8008"

  # HAProxy: :5000 follows the primary, :5001 balances replicas, :7000 stats
  haproxy:
    image: haproxy:3.4-alpine
    container_name: haproxy-patroni
    restart: unless-stopped
    volumes:
      - ./patroni/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "127.0.0.1:5000:5000"
      - "127.0.0.1:5001:5001"
      - "127.0.0.1:7000:7000"
    networks: [patroni-net]
    depends_on:
      - patroni1
      - patroni2
      - patroni3

volumes:
  etcd-data:
  patroni1-data:
  patroni2-data:
  patroni3-data:
  pgbackrest-repo:

networks:
  patroni-net:
    driver: bridge
