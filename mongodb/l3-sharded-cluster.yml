name: mongo-sharded

# MongoDB 9.0 sharded cluster: config-server replica set (3), two shard replica
# sets (3 each) and two mongos routers = 11 mongod/mongos processes + init jobs.
# Needs about 3 GB RAM. Smoke test: tests/mongo-sharded-smoke.sh
#
# Start order: keyfile -> all mongod -> init-csrs / init-shard1 / init-shard2
# (rs.initiate + root user over the localhost exception) -> mongos -> shard-add
# (addShard + shardCollection appdb.events on hashed userId)

x-mongo-common: &mongo-common
  image: mongo:9.0
  restart: unless-stopped
  healthcheck:
    # Port-open check: starting a mongosh (Node.js) every few seconds in 9-11 containers
    # starves a small CI runner. The init jobs retry until the members really answer.
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/27017'"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 10s
  ulimits:
    nproc: 64000
    nofile:
      soft: 64000
      hard: 64000
  depends_on:
    keyfile-init:
      condition: service_completed_successfully

# Generates the internal-auth keyfile once into a named volume (owner mongodb, mode 400)
x-keyfile-init: &keyfile-init
  image: mongo:9.0
  user: root
  restart: "no"
  command:
    - sh
    - -c
    - |
      test -s /keys/mongo-keyfile || head -c 756 /dev/urandom | base64 | tr -d '\n' > /keys/mongo-keyfile
      chown mongodb:mongodb /keys/mongo-keyfile
      chmod 400 /keys/mongo-keyfile

services:
  keyfile-init:
    <<: *keyfile-init
    volumes: [mongo-keyfile:/keys]

  configsvr1:
    <<: *mongo-common
    container_name: configsvr1
    hostname: configsvr1
    ports: ["127.0.0.1:27119:27017"]
    volumes:
      - configsvr1-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --configsvr --replSet csrs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  configsvr2:
    <<: *mongo-common
    container_name: configsvr2
    hostname: configsvr2
    ports: ["127.0.0.1:27120:27017"]
    volumes:
      - configsvr2-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --configsvr --replSet csrs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  configsvr3:
    <<: *mongo-common
    container_name: configsvr3
    hostname: configsvr3
    ports: ["127.0.0.1:27121:27017"]
    volumes:
      - configsvr3-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --configsvr --replSet csrs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  shard1-node1:
    <<: *mongo-common
    container_name: shard1-node1
    hostname: shard1-node1
    ports: ["127.0.0.1:27301:27017"]
    volumes:
      - shard1-node1-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --shardsvr --replSet shard1rs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  shard1-node2:
    <<: *mongo-common
    container_name: shard1-node2
    hostname: shard1-node2
    ports: ["127.0.0.1:27302:27017"]
    volumes:
      - shard1-node2-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --shardsvr --replSet shard1rs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  shard1-node3:
    <<: *mongo-common
    container_name: shard1-node3
    hostname: shard1-node3
    ports: ["127.0.0.1:27303:27017"]
    volumes:
      - shard1-node3-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --shardsvr --replSet shard1rs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  shard2-node1:
    <<: *mongo-common
    container_name: shard2-node1
    hostname: shard2-node1
    ports: ["127.0.0.1:27401:27017"]
    volumes:
      - shard2-node1-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --shardsvr --replSet shard2rs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  shard2-node2:
    <<: *mongo-common
    container_name: shard2-node2
    hostname: shard2-node2
    ports: ["127.0.0.1:27402:27017"]
    volumes:
      - shard2-node2-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --shardsvr --replSet shard2rs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  shard2-node3:
    <<: *mongo-common
    container_name: shard2-node3
    hostname: shard2-node3
    ports: ["127.0.0.1:27403:27017"]
    volumes:
      - shard2-node3-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --shardsvr --replSet shard2rs --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 256

  init-csrs:
    image: mongo:9.0
    container_name: init-csrs
    restart: "no"
    # Same network namespace as configsvr1: connecting to localhost triggers the
    # localhost exception, which is how the first user is created while auth is on.
    network_mode: "service:configsvr1"
    depends_on:
      configsvr1: {condition: service_healthy}
      configsvr2: {condition: service_healthy}
      configsvr3: {condition: service_healthy}
    environment:
      RS_ID: csrs
      RS_HOSTS: configsvr1:27017,configsvr2:27017,configsvr3:27017
      RS_CONFIGSVR: "true"
      ROOT_USER: ${MONGO_ROOT_USER:-admin}
      ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["mongosh", "--quiet", "--file", "/scripts/init-replica-set.js"]

  init-shard1:
    image: mongo:9.0
    container_name: init-shard1
    restart: "no"
    # Same network namespace as shard1-node1: connecting to localhost triggers the
    # localhost exception, which is how the first user is created while auth is on.
    network_mode: "service:shard1-node1"
    depends_on:
      shard1-node1: {condition: service_healthy}
      shard1-node2: {condition: service_healthy}
      shard1-node3: {condition: service_healthy}
    environment:
      RS_ID: shard1rs
      RS_HOSTS: shard1-node1:27017,shard1-node2:27017,shard1-node3:27017
      RS_CONFIGSVR: "false"
      ROOT_USER: ${MONGO_ROOT_USER:-admin}
      ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["mongosh", "--quiet", "--file", "/scripts/init-replica-set.js"]

  init-shard2:
    image: mongo:9.0
    container_name: init-shard2
    restart: "no"
    # Same network namespace as shard2-node1: connecting to localhost triggers the
    # localhost exception, which is how the first user is created while auth is on.
    network_mode: "service:shard2-node1"
    depends_on:
      shard2-node1: {condition: service_healthy}
      shard2-node2: {condition: service_healthy}
      shard2-node3: {condition: service_healthy}
    environment:
      RS_ID: shard2rs
      RS_HOSTS: shard2-node1:27017,shard2-node2:27017,shard2-node3:27017
      RS_CONFIGSVR: "false"
      ROOT_USER: ${MONGO_ROOT_USER:-admin}
      ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["mongosh", "--quiet", "--file", "/scripts/init-replica-set.js"]

  mongos1:
    image: mongo:9.0
    container_name: mongos1
    hostname: mongos1
    restart: unless-stopped
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongos --configdb csrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
      --bind_ip_all --keyFile /etc/mongo-keys/mongo-keyfile
    depends_on:
      init-csrs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mongos2:
    image: mongo:9.0
    container_name: mongos2
    hostname: mongos2
    restart: unless-stopped
    ports: ["127.0.0.1:27018:27017"]
    volumes:
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongos --configdb csrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
      --bind_ip_all --keyFile /etc/mongo-keys/mongo-keyfile
    depends_on:
      init-csrs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # One-shot: register the shards and shard appdb.events (runs next to mongos1, authenticated)
  shard-add:
    image: mongo:9.0
    container_name: shard-add
    restart: "no"
    network_mode: "service:mongos1"
    depends_on:
      mongos1: {condition: service_healthy}
      init-shard1: {condition: service_completed_successfully}
      init-shard2: {condition: service_completed_successfully}
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-admin}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint:
      - sh
      - -c
      - |
        until mongosh --quiet -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin --file /scripts/add-shards.js; do
          echo "mongos not ready, retrying"; sleep 3
        done

volumes:
  mongo-keyfile:
  configsvr1-data:
  configsvr2-data:
  configsvr3-data:
  shard1-node1-data:
  shard1-node2-data:
  shard1-node3-data:
  shard2-node1-data:
  shard2-node2-data:
  shard2-node3-data:
