version: "3.9"

# MongoDB Sharded Cluster
# Components:
#   - Config Server Replica Set (csrs): 3 nodes — stores cluster metadata
#   - Shard 1 Replica Set (shard1rs): 3 nodes — data partition 1
#   - Shard 2 Replica Set (shard2rs): 3 nodes — data partition 2
#   - mongos routers: 2 nodes — query routing layer (stateless)
# Total: 11 containers

x-mongo-shard-common: &mongo-shard-common
  image: mongo:7.0
  restart: unless-stopped
  ulimits:
    nproc: 64000
    nofile:
      soft: 64000
      hard: 64000

services:
  ###########################################################################
  # Config Server Replica Set (csrs)
  ###########################################################################
  configsvr1:
    <<: *mongo-shard-common
    container_name: configsvr1
    hostname: configsvr1
    networks: [mongo-shard-net]
    ports: ["27119:27017"]
    volumes:
      - configsvr1-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --configsvr
        --replSet csrs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 0.5

  configsvr2:
    <<: *mongo-shard-common
    container_name: configsvr2
    hostname: configsvr2
    networks: [mongo-shard-net]
    ports: ["27120:27017"]
    volumes:
      - configsvr2-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --configsvr
        --replSet csrs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 0.5

  configsvr3:
    <<: *mongo-shard-common
    container_name: configsvr3
    hostname: configsvr3
    networks: [mongo-shard-net]
    ports: ["27121:27017"]
    volumes:
      - configsvr3-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --configsvr
        --replSet csrs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 0.5

  ###########################################################################
  # Shard 1 Replica Set (shard1rs)
  ###########################################################################
  shard1-node1:
    <<: *mongo-shard-common
    container_name: shard1-node1
    hostname: shard1-node1
    networks: [mongo-shard-net]
    ports: ["27217:27017"]
    volumes:
      - shard1-node1-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --shardsvr
        --replSet shard1rs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 1
        --oplogSize 512

  shard1-node2:
    <<: *mongo-shard-common
    container_name: shard1-node2
    hostname: shard1-node2
    networks: [mongo-shard-net]
    ports: ["27218:27017"]
    volumes:
      - shard1-node2-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --shardsvr
        --replSet shard1rs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 1
        --oplogSize 512

  shard1-node3:
    <<: *mongo-shard-common
    container_name: shard1-node3
    hostname: shard1-node3
    networks: [mongo-shard-net]
    ports: ["27219:27017"]
    volumes:
      - shard1-node3-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --shardsvr
        --replSet shard1rs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 1
        --oplogSize 512

  ###########################################################################
  # Shard 2 Replica Set (shard2rs)
  ###########################################################################
  shard2-node1:
    <<: *mongo-shard-common
    container_name: shard2-node1
    hostname: shard2-node1
    networks: [mongo-shard-net]
    ports: ["27317:27017"]
    volumes:
      - shard2-node1-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --shardsvr
        --replSet shard2rs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 1
        --oplogSize 512

  shard2-node2:
    <<: *mongo-shard-common
    container_name: shard2-node2
    hostname: shard2-node2
    networks: [mongo-shard-net]
    ports: ["27318:27017"]
    volumes:
      - shard2-node2-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --shardsvr
        --replSet shard2rs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 1
        --oplogSize 512

  shard2-node3:
    <<: *mongo-shard-common
    container_name: shard2-node3
    hostname: shard2-node3
    networks: [mongo-shard-net]
    ports: ["27319:27017"]
    volumes:
      - shard2-node3-data:/data/db
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongod
        --shardsvr
        --replSet shard2rs
        --bind_ip_all
        --auth
        --keyFile /etc/mongo-keyfile
        --wiredTigerCacheSizeGB 1
        --oplogSize 512

  ###########################################################################
  # mongos routers (stateless query routers)
  ###########################################################################
  mongos1:
    image: mongo:7.0
    container_name: mongos1
    hostname: mongos1
    restart: unless-stopped
    networks: [mongo-shard-net]
    ports: ["27017:27017"]
    volumes:
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongos
        --configdb csrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
        --bind_ip_all
        --keyFile /etc/mongo-keyfile
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3

  mongos2:
    image: mongo:7.0
    container_name: mongos2
    hostname: mongos2
    restart: unless-stopped
    networks: [mongo-shard-net]
    ports: ["27018:27017"]
    volumes:
      - ./keyfile/mongo-keyfile:/etc/mongo-keyfile:ro
    command: >
      mongos
        --configdb csrs/configsvr1:27017,configsvr2:27017,configsvr3:27017
        --bind_ip_all
        --keyFile /etc/mongo-keyfile
    depends_on:
      - configsvr1
      - configsvr2
      - configsvr3

  ###########################################################################
  # Cluster initializer (one-shot)
  ###########################################################################
  mongo-shard-init:
    image: mongo:7.0
    container_name: mongo-shard-init
    networks: [mongo-shard-net]
    restart: "no"
    depends_on:
      - mongos1
      - shard1-node1
      - shard2-node1
    entrypoint:
      - bash
      - -c
      - |
        sleep 10
        # Init config server replica set
        mongosh --host configsvr1 --eval "
          rs.initiate({
            _id: 'csrs',
            configsvr: true,
            members: [
              { _id: 0, host: 'configsvr1:27017' },
              { _id: 1, host: 'configsvr2:27017' },
              { _id: 2, host: 'configsvr3:27017' }
            ]
          })
        "
        sleep 5
        # Init shard1 replica set
        mongosh --host shard1-node1 --eval "
          rs.initiate({
            _id: 'shard1rs',
            members: [
              { _id: 0, host: 'shard1-node1:27017' },
              { _id: 1, host: 'shard1-node2:27017' },
              { _id: 2, host: 'shard1-node3:27017' }
            ]
          })
        "
        # Init shard2 replica set
        mongosh --host shard2-node1 --eval "
          rs.initiate({
            _id: 'shard2rs',
            members: [
              { _id: 0, host: 'shard2-node1:27017' },
              { _id: 1, host: 'shard2-node2:27017' },
              { _id: 2, host: 'shard2-node3:27017' }
            ]
          })
        "
        sleep 10
        # Add shards and create admin user via mongos
        mongosh --host mongos1 --eval "
          sh.addShard('shard1rs/shard1-node1:27017,shard1-node2:27017,shard1-node3:27017');
          sh.addShard('shard2rs/shard2-node1:27017,shard2-node2:27017,shard2-node3:27017');
          db.getSiblingDB('admin').createUser({
            user: '${MONGO_ROOT_USER:-admin}',
            pwd: '${MONGO_ROOT_PASSWORD:-adminpassword}',
            roles: ['root']
          });
          sh.enableSharding('appdb');
          sh.shardCollection('appdb.events', { userId: 'hashed' });
          sh.status();
        "

volumes:
  configsvr1-data:
  configsvr2-data:
  configsvr3-data:
  shard1-node1-data:
  shard1-node2-data:
  shard1-node3-data:
  shard2-node1-data:
  shard2-node2-data:
  shard2-node3-data:

networks:
  mongo-shard-net:
    driver: bridge

