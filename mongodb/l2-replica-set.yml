name: mongo-replica-set

# MongoDB 9.0 replica set rs0: 3 data-bearing members with keyFile internal auth.
# mongo1 has the highest priority (preferred primary); stop it and the others elect
# a new primary. The root user is created by the init job over the localhost exception
# (no MONGO_INITDB_* variables, which the image cannot combine with --keyFile cleanly).
# Election test: tests/mongo-replica-election.sh

x-mongo-common: &mongo-common
  image: mongo:9.0
  restart: unless-stopped
  healthcheck:
    # ping is allowed before authentication
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20
    start_period: 20s
  ulimits:
    nproc: 64000
    nofile:
      soft: 64000
      hard: 64000
  depends_on:
    keyfile-init:
      condition: service_completed_successfully

# Generates the internal-auth keyfile once into a named volume (owner mongodb, mode 400)
x-keyfile-init: &keyfile-init
  image: mongo:9.0
  user: root
  restart: "no"
  command:
    - sh
    - -c
    - |
      test -s /keys/mongo-keyfile || head -c 756 /dev/urandom | base64 | tr -d '\n' > /keys/mongo-keyfile
      chown mongodb:mongodb /keys/mongo-keyfile
      chmod 400 /keys/mongo-keyfile

services:
  keyfile-init:
    <<: *keyfile-init
    volumes: [mongo-keyfile:/keys]

  mongo1:
    <<: *mongo-common
    container_name: mongo1
    hostname: mongo1
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo1-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 512 --slowms 100

  mongo2:
    <<: *mongo-common
    container_name: mongo2
    hostname: mongo2
    ports: ["127.0.0.1:27018:27017"]
    volumes:
      - mongo2-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 512 --slowms 100

  mongo3:
    <<: *mongo-common
    container_name: mongo3
    hostname: mongo3
    ports: ["127.0.0.1:27019:27017"]
    volumes:
      - mongo3-data:/data/db
      - mongo-keyfile:/etc/mongo-keys:ro
    command: >
      mongod --replSet rs0 --bind_ip_all --auth --keyFile /etc/mongo-keys/mongo-keyfile
      --wiredTigerCacheSizeGB 0.25 --oplogSize 512 --slowms 100

  mongo-rs-init:
    image: mongo:9.0
    container_name: mongo-rs-init
    restart: "no"
    # Same network namespace as mongo1: connecting to localhost triggers the
    # localhost exception, which is how the first user is created while auth is on.
    network_mode: "service:mongo1"
    depends_on:
      mongo1: {condition: service_healthy}
      mongo2: {condition: service_healthy}
      mongo3: {condition: service_healthy}
    environment:
      RS_ID: rs0
      RS_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      RS_CONFIGSVR: "false"
      ROOT_USER: ${MONGO_ROOT_USER:-admin}
      ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      APP_DB: appdb
      APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}
    volumes:
      - ./scripts:/scripts:ro
    entrypoint: ["mongosh", "--quiet", "--file", "/scripts/init-replica-set.js"]

volumes:
  mongo-keyfile:
  mongo1-data:
  mongo2-data:
  mongo3-data:

# App connection string:
#   mongodb://appuser:apppassword@mongo1:27017,mongo2:27017,mongo3:27017/appdb?replicaSet=rs0
