name: mongo-basic

# Single MongoDB 9.0 with auth, WiredTiger tuning and an init script (./init).
# Mongo Express UI is opt-in: docker compose --profile ui up

services:
  mongodb:
    image: mongo:9.0
    container_name: mongodb-basic
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: appdb
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-apppassword}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./init:/docker-entrypoint-initdb.d:ro
    command: >
      mongod --auth --bind_ip_all
      --wiredTigerCacheSizeGB 1
      --wiredTigerJournalCompressor snappy
      --wiredTigerCollectionBlockCompressor snappy
      --wiredTigerIndexPrefixCompression true
      --slowms 100 --profile 1
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USER:-admin}
        - --password
        - ${MONGO_ROOT_PASSWORD:-adminpassword}
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ulimits:
      nproc: 64000
      nofile:
        soft: 64000
        hard: 64000

  # Web UI (the 1.0.x line is the last stable; 1.1 is still release-candidate)
  mongo-express:
    profiles: [ui]
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${EXPRESS_PASSWORD:-expresspassword}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
  mongodb-config:
