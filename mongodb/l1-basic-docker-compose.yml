version: "3.9"

# Single MongoDB instance with auth, WiredTiger tuning, and persistent storage
services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-basic
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-appdb}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
      - ./init:/docker-entrypoint-initdb.d:ro
    command: >
      mongod
        --auth
        --bind_ip_all
        --wiredTigerCacheSizeGB 1
        --wiredTigerJournalCompressor snappy
        --wiredTigerCollectionBlockCompressor snappy
        --wiredTigerIndexPrefixCompression true
        --oplogSize 1024
        --slowms 100
        --profile 1
    healthcheck:
      test: >
        mongosh --quiet --eval
        "db.adminCommand('ping').ok"
        --username ${MONGO_ROOT_USER:-admin}
        --password ${MONGO_ROOT_PASSWORD:-adminpassword}
        --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nproc: 64000
      nofile:
        soft: 64000
        hard: 64000

  # Mongo Express web UI
  mongo-express:
    image: mongo-express:1.0
    container_name: mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-adminpassword}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-adminpassword}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${EXPRESS_PASSWORD:-expresspassword}
    ports:
      - "8081:8081"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb-data:
  mongodb-config:

